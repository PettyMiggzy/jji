<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Junk Junkies</title>
    {% include '_brand.html' %}
</head>
<body>
    <div class="login-wrap"><div class="login-container">
        <div class="login-header">
            <img src="https://junkjunkiesindiana.com/assets/logo-icon.png" alt="" onerror="this.style.display='none'">
            <h1>Lead Tool Admin</h1>
            <p>Sign in to manage lead searches</p>
            <span class="admin-badge">Restricted</span>
        </div>

        {% if error %}
        <div class="error-message show">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autofocus
                >
            </div>

            <button type="submit" class="login-btn">Access Admin Panel</button>
        </form>

        <div class="back-link">
            <a href="https://junkjunkiesindiana.com/">Back to junkjunkiesindiana.com</a>
        </div>
    </div></div>
</body>
</html>
