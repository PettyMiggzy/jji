<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Junk Junkies</title>
    {% include '_brand.html' %}
</head>
<body>
    <div class="topbar"><div class="topbar-inner">
        <a class="brand" href="https://junkjunkiesindiana.com/"><img src="https://junkjunkiesindiana.com/assets/logo-icon.png" alt="" onerror="this.style.display='none'"><span class="brand-name">JUNK<b>JUNKIES</b><small>LEAD TOOL</small></span></a>
        <div class="header-actions">{% include '_nav.html' %}</div>
    </div></div>

    <div class="container">
        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Searches</div>
                <div class="stat-value" id="totalSearches">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Leads Collected</div>
                <div class="stat-value" id="totalLeads">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Leads Per Search</div>
                <div class="stat-value" id="avgLeads">0</div>
            </div>
        </div>

        <!-- Searches Section -->
        <div class="searches-section">
            <h2>All Lead Searches</h2>

            <div class="controls">
                <input
                    type="text"
                    id="searchFilter"
                    class="search-input"
                    placeholder="Filter by location..."
                >
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="apartments">Apartments</button>
                <button class="filter-btn" data-filter="trailers">Trailers</button>
                <button class="filter-btn" data-filter="housing_companies">Companies</button>
            </div>

            <div id="searchesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading searches...</p>
                </div>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon"></div>
                <p>No searches found. Start by running a lead search!</p>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Search Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" style="display: none;"></div>

    <script>
        let allSearches = [];
        let currentFilter = 'all';

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadSearches();
            setupEventListeners();
        });

        // Setup filter buttons
        function setupEventListeners() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderSearches();
                });
            });

            document.getElementById('searchFilter').addEventListener('input', (e) => {
                renderSearches(e.target.value);
            });
        }

        // Load all searches from API
        async function loadSearches() {
            try {
                const response = await fetch('/api/admin/stats');
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/admin/login';
                        return;
                    }
                    throw new Error('Failed to load searches');
                }

                const data = await response.json();
                allSearches = data.searches || [];

                // Update stats
                document.getElementById('totalSearches').textContent = data.total_searches;
                document.getElementById('totalLeads').textContent = data.total_leads;
                const avg = data.total_searches > 0 ? Math.round(data.total_leads / data.total_searches) : 0;
                document.getElementById('avgLeads').textContent = avg;

                renderSearches();
            } catch (error) {
                console.error('Error loading searches:', error);
                showToast(error.message, 'error');
                document.getElementById('searchesContainer').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading searches</p>
                    </div>
                `;
            }
        }

        // Render searches table
        function renderSearches(filterText = '') {
            let filtered = allSearches;

            // Filter by type
            if (currentFilter !== 'all') {
                filtered = filtered.filter(s => s.property_type === currentFilter);
            }

            // Filter by search text
            if (filterText) {
                filtered = filtered.filter(s =>
                    s.location.toLowerCase().includes(filterText.toLowerCase())
                );
            }

            const container = document.getElementById('searchesContainer');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            let html = `
                <table class="searches-table">
                    <thead>
                        <tr>
                            <th>Search ID</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Radius</th>
                            <th>Leads</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach(search => {
                const date = new Date(search.created_at).toLocaleDateString();
                const time = new Date(search.created_at).toLocaleTimeString();
                html += `
                    <tr class="search-row">
                        <td><span class="search-id">${escapeHtml(search.search_id)}</span></td>
                        <td>${escapeHtml(search.location)}</td>
                        <td><span class="property-type">${escapeHtml(search.property_type.replace('_', ' '))}</span></td>
                        <td>${search.radius} mi</td>
                        <td><strong>${search.lead_count}</strong></td>
                        <td>${date}<br><small>${time}</small></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-small btn-view" onclick="viewDetails('${escapeHtml(search.search_id)}')">View</button>
                                <a href="/api/export/${escapeHtml(search.search_id)}" class="btn-small btn-export" style="text-decoration: none;">CSV</a>
                                <button class="btn-small btn-delete" onclick="deleteSearch('${escapeHtml(search.search_id)}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // View search details
        async function viewDetails(searchId) {
            try {
                const response = await fetch(`/api/results/${searchId}`);
                if (!response.ok) throw new Error('Failed to load details');

                const data = await response.json();
                const leads = data.leads || [];

                let leadsHtml = `
                    <div>
                        <h3>Search Information</h3>
                        <p><strong>Location:</strong> ${escapeHtml(data.location)}</p>
                        <p><strong>Radius:</strong> ${data.radius} miles</p>
                        <p><strong>Type:</strong> ${escapeHtml(data.property_type.replace('_', ' '))}</p>
                        <p><strong>Leads Found:</strong> ${leads.length}</p>
                        <p><strong>Date:</strong> ${new Date(data.created_at).toLocaleString()}</p>

                        <h3 style="margin-top: 20px;">Leads</h3>
                        <table class="leads-table">
                            <thead>
                                <tr>
                                    <th>Company Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                leads.forEach(lead => {
                    leadsHtml += `
                        <tr>
                            <td>${escapeHtml(lead.name)}</td>
                            <td><a href="mailto:${escapeHtml(lead.email)}">${escapeHtml(lead.email)}</a></td>
                            <td>${escapeHtml(lead.phone || 'N/A')}</td>
                            <td>${escapeHtml(lead.address || 'N/A')}</td>
                        </tr>
                    `;
                });

                leadsHtml += `
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById('modalTitle').textContent = `Search Details - ${escapeHtml(data.location)}`;
                document.getElementById('modalBody').innerHTML = leadsHtml;
                document.getElementById('detailsModal').classList.add('show');
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Delete search
        async function deleteSearch(searchId) {
            if (!confirm('Are you sure you want to delete this search?')) return;

            try {
                const response = await fetch(`/api/admin/search/${searchId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete search');

                showToast('Search deleted successfully');
                loadSearches();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.style.display = 'block';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Close modal on background click
        document.getElementById('detailsModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailsModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
